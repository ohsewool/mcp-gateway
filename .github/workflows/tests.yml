# Tests do not prove anything if they quietly stop running.
#
# Every job below asserts how many tests were collected. A dependency that
# vanishes turns importorskip into a silent pass: this repository would go from
# 177 tests to 151 and still show green. The count is the difference between
# "the tests passed" and "the tests ran".

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install -r requirements.txt

      # The approval and cross-store tests delegate to the core's ledger. Absent
      # it, five skip and forty-six are never collected at all, and the run still
      # passes - the exact silence this workflow exists to break. (This comment
      # said "35 of them skip" until 2026-08-22, when the numbers were measured
      # for the first time. The README said 139 passed. Neither was right, and
      # nothing compared them. The `without-core` job below now does.)
      - name: Check out agent-safety-core
        uses: actions/checkout@v4
        with:
          repository: ohsewool/agent-safety-core
          path: .sibling/agent-safety-core

      # Checking the sibling out is not the same as being able to import it.
      # The core signs checkpoints, so it needs cryptography; without it the
      # import fails and its dependents skip exactly as if the repository were
      # absent.
      - name: Install the sibling
        # Installed rather than reached into with PYTHONPATH: that only worked
        # because the core happened to sit importable at its repository root,
        # and it left the core's own dependencies to be guessed at - which cost
        # 21 tests until cryptography was added by hand.
        run: pip install -e .sibling/agent-safety-core

      - name: Fetch the MCP server the integration tests talk to
        run: npx -y @modelcontextprotocol/server-filesystem --version || true

      - name: Refuse a silently shrinking suite
        run: |
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          echo "collected $collected, expecting at least 146"
          if [ "${collected:-0}" -lt 146 ]; then
            echo "::error::only $collected tests collected; expected at least 146."
            echo "Something is being skipped that should be running."
            exit 1
          fi

      - name: Refuse a README that miscounts its own tests
        run: |
          # These numbers were hand-maintained and drifted twice - the second
          # time in a repository whose README I had just verified. A count kept
          # by hand is a count that rots, so CI compares them.
          claimed=$(grep -oE '[0-9]+ tests' README.md | head -1 | grep -oE '^[0-9]+')
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          echo "README says ${claimed:-none}, pytest collects ${collected:-none}"
          if [ "${claimed:-0}" != "${collected:-1}" ]; then
            echo "::error::README claims ${claimed} tests; ${collected} are collected."
            exit 1
          fi

      - name: Run the suite
        run: python -m pytest -q -rs   # -rs names every skip and why

      - name: Refuse a line this suite never executes
        # A coverage sweep on 2026-08-22 found 44 statements no test ever ran.
        # Among them: every line of `HttpProxy._post`'s real network path - the
        # three error translations this README promises are the same principle
        # as the pipe's - and the whole of `python3 -m mcp_gateway.audit verify`,
        # a command the README tells people to run.
        #
        # 100% is a gate, not a target. A new defensive branch either gets a test
        # or gets `# pragma: no cover` with a reason beside it. Writing those
        # reasons is how three of them turned out to be second layers over a
        # first that already refuses.
        run: |
          pip install -q coverage
          python -m coverage run --source=mcp_gateway -m pytest -q > /dev/null
          python -m coverage report -m --fail-under=100

  # The README claims the gateway works without its sibling. That sentence had
  # never been run: the count in it was written once and left behind while the
  # total beside it was maintained. Measuring is cheap - not measuring is how a
  # repository ends up holding three different numbers for one fact.
  without-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install this repository only
        run: pip install -r requirements.txt

      - name: Fetch the MCP server the integration tests talk to
        run: npx -y @modelcontextprotocol/server-filesystem --version || true

      - name: Prove the core really is absent
        # Without this, a run where the core happens to be importable would
        # report the with-core numbers and the comparison below would fail for
        # a reason that has nothing to do with what it is checking.
        run: |
          if python -c "import core" 2>/dev/null; then
            echo "::error::agent-safety-core is importable; this job measures its absence."
            exit 1
          fi
          echo "core is not importable, as this job requires"

      - name: Compare the README's without-core numbers against a measurement
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee run.txt || true
          passed=$(grep -oE '[0-9]+ passed' run.txt | tail -1 | grep -oE '^[0-9]+')
          skipped=$(grep -oE '[0-9]+ skipped' run.txt | tail -1 | grep -oE '^[0-9]+')
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          # 처음 쓴 패턴은 `코어 없이 \*\*[0-9]+개 통과`였고 빈 값을 냈다 -
          # README의 강조는 "코어" 앞에 붙어 있다. 로컬에서 돌려보지 않았으면
          # CI가 "README와 다르다"고 말했을 것이고, 원인은 README가 아니라 이 줄이다.
          claimed_pass=$(grep -oE '코어 없이 [0-9]+개 통과' README.md \
            | grep -oE '[0-9]+')
          claimed_skip=$(grep -oE '[0-9]+개 skip' README.md | head -1 | grep -oE '^[0-9]+')
          echo "measured: ${passed:-none} passed, ${skipped:-none} skipped, ${collected:-none} collected"
          echo "README:   ${claimed_pass:-none} passed, ${claimed_skip:-none} skipped"
          if [ "${passed:-0}" != "${claimed_pass:-1}" ] || [ "${skipped:-0}" != "${claimed_skip:-1}" ]; then
            echo "::error::README's without-core numbers do not match a measurement."
            exit 1
          fi
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::nothing passed; this comparison would agree with any README."
            exit 1
          fi

          # `collected`는 위에서 재놓고 **아무도 읽지 않았다** - 이 저장소들이
          # 반복해서 잡아온 모양 그대로다. README의 세 번째 숫자("그때 N개는 아예
          # 수집되지 않는다")가 바로 그 값에 달려 있고, 그 문장의 요점은 skip 수보다
          # 수집되지 않는 수가 크다는 것이다. 재놓고 안 보면 그 요점이 틀려도 초록불이다.
          claimed_total=$(grep -oE '코어가 있으면 [0-9]+개 전부 통과' README.md \
            | grep -oE '[0-9]+')
          claimed_uncollected=$(grep -oE '그때 [0-9]+개는 아예 수집되지 않는다' README.md \
            | grep -oE '[0-9]+')
          if [ -z "${claimed_total}" ] || [ -z "${claimed_uncollected}" ]; then
            echo "::error::README에서 전체 수/미수집 수를 읽지 못했다. 문장이 바뀌었으면"
            echo "이 비교는 아무것도 확인하지 않는다 - 빈 값으로 통과시키지 않는다."
            exit 1
          fi
          measured_uncollected=$((claimed_total - collected))
          echo "미수집: 측정 ${measured_uncollected} (${claimed_total} - ${collected}), README ${claimed_uncollected}"
          if [ "${measured_uncollected}" != "${claimed_uncollected}" ]; then
            echo "::error::README claims ${claimed_uncollected} tests are never collected; ${measured_uncollected} are."
            exit 1
          fi
          if [ "${measured_uncollected}" -le "${skipped:-0}" ]; then
            echo "::error::수집되지 않는 수(${measured_uncollected})가 skip 수(${skipped})보다 크지 않다."
            echo "README 문장의 요점이 그것이다. 숫자만 맞추지 말고 문장을 고쳐라."
            exit 1
          fi
